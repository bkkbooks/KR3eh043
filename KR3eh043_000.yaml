front:
  text: 瘋病又一治法次序以上三十六症狀下未列治法者可照下列三次治法分次治之再不愈另採備用各方輔助之第一次治法藥初一日服追風散瀉惡血用大黃二兩蟬殼一兩八錢白花蛇選用小者妙皂角刺各二兩共為末每服五六錢入大楓子油一錢朴硝少許用老酒一盞調化送下不可熱服夜粥不可食待戌時放前藥一碗在桌上盆內以糖煎或蜜煎少許放在盤中不得令患者先見藥服藥畢用水漱以蜜過口切不可睡去食人伴坐良久肝腹大疼最妙瀉四五次用薄粥補之初二日服消風散用白芷一錢全蠍一兩去尖人參一兩共為細末每服二錢午間吃粥晚不要吃夜粥次早溫酒調服二錢早飯須遲吃身上微癢為妙初三日服磨風散用羌活獨活小川芎天麻細辛葳靈仙防風荊芥麻黃何首烏蔓荊子牛蒡子蝦麻草蒼耳草各一兩共為細末不見火煮酒調服一錢假如初一日服追風散初二日服消風散初三日服磨風散初四日又服追風散初五日又服消風散初六日又服磨風散瘦弱者半月一服譬如初一日服起初三日止十五日服起十七日止強壯人十日一服譬如初一日起初三止十一起十三止二十一起二十三止要切記日數為準服兩月後日日服大麻瘋丸藥大楓子肉二兩白色者用如油過黃色者不可用白花蛇防風烏藥羌活獨活僵蟲炒全蠍首烏荊芥細辛甘草天麻苦參人參南星薑汁拌炒白芷川烏童便浸蒸三次牛膝當歸麥冬地黃各四兩沉香四兩米糊為丸如梧桐子大每服三錢空心午間臨臥白湯送下一日准服三次神效第二次治法藥第一次治法不愈用此醉仙散先量病人大小虛實凡證候重而急者須先以再造散下之候補養得完後與此藥用胡麻子牛蒡子蔓荊子枸杞子各一兩同炒蒺藜苦參瓜蔞根防風各五錢上為末每一兩五錢入輕粉二錢拌勻大人每服一錢淡酒調下辰午戌各一服後五七日先於牙縫內流黃涎水渾身覺痛昏悶如醉後利下膿血惡臭尿為度服再造散當日必利下惡物或異物或臭或膿或蟲蟲口黑色乃多年者赤色是近年數日又進一服無蟲乃止方用鬱金五錢如無升麻代皂角刺黑者大黃泡一兩白牽牛六錢半生半炒木通朴硝上為末每服半兩早晨無灰酒面東送下忌毒食半月止食白粥漸至眉毛皮膚如常甚者三二次而愈依法調理不可妄有勞動終身忌牛馬驢騾雉野味糟臟犯者再舉不治又換肌散治大瘋年久不瘥眉毛脫落鼻梁崩壞不易取效用白花蛇四兩酒浸去皮骨地龍二兩去泥當歸細辛白芨白芷天麻蔓荊子靈仙荊芥甘菊苦參柴胡沙參木賊不灰木炙甘草沙苑蒺藜天門冬赤芍藥定風草何首烏菖蒲胡麻子草烏去皮臍蒼朮川芎各一錢上為末每服三錢以酒儘量為度第三次治法藥第二次又不愈用此紫花丸用木香沉香各二錢五分人參一兩當歸七錢五分天麻五錢皂角刺五錢寸香一錢五分乳香沒藥各二錢雄黃五錢辰砂五錢肉豆蔻一枚定風草一錢五分還童子一兩為末作一處包之白花蛇一條酒浸濕去頭尾皮骨何首烏荊芥穗靈仙蛇床子各二錢麻黃去根節二錢胡麻子一錢上六味拌蛇浸一宿通取出曬乾仍還原酒浸曝酒盡為度上藥為末作一處包之防風羌活甘草細辛川芎獨活蒼朮枇杷葉白芍藥赤芍藥白蒺藜金銀花五加皮白芷苦參各五錢胡麻子白附子麻黃川牛膝草烏川烏泔水浸泡石菖蒲各二錢五分上藥為末作一處包之以大楓子半斤去殼新鮮者佳髮油黃色者不堪用磁器盛之封其口頓沸湯中鍋蓋密封之勿令透氣文武火煎候黑爛為度杵無渣如油入已上三包藥加元米飯杵膏糊丸如梧桐子大曬乾不見火每五十丸雞鳴午時臨臥各進一服茶湯送下輕者一料可愈重者三五料斷根為度止吃時菜白粥余物總忌庶免再發
