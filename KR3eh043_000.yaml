灰酒二斗放壇中浸密封七日後開每日三度溫飲一小盞忌豬雞肉硫黃酒用透明鋒鋩硫黃二錢乳鉢內研細入酒再研空心飲其清酒將渣再研又入酒飲之日日如此硫黃能殺惡蟲從大便下五參散人參丹參沙參苦參各一兩白花蛇酒浸去頭皮各一兩五錢上為細末每服二錢食後臨臥溫酒調下故炊帚散故炊帚甑帶鞋底蛇脫皮一條上以月蝕夜伺候正蝕時都燒成灰研令極細每服不拘時候以溫酒調服二錢仍以醋調藥如膏以塗敷上即消虎骨散虎骨醋炙黃烏梅肉赤茯苓肉蓯蓉酒浸切焙甘草炙芍藥炒鱉甲醋炙白朮炒人參豆豉文火炒紫苑去土黃耆蜜炙常山炒知母枳殼炒犀角鎊各一兩當歸升麻柴胡桔梗前胡桂心木香桃仁湯炮去皮尖天靈蓋酥炙各一兩上為細末每服二錢溫酒調下早晚各一服尉法黑豆五升芫花一斤生薑切用半斤上俱炒旋入醋拌用青布包尉痛處更番炒尉以效為度追風逐濕遇仙膏海風藤六兩萆麻子六兩麻黃八兩川烏草烏南星羌活桂枝各四兩蛇床子三兩土木鱉淨肉三兩大楓子八兩白附子杏仁研獨活防風荊芥細辛赤芍藥紅花當歸黃耆各二兩白芷二兩番打麻六兩銀花四兩以上藥料用麻油七斤蔥汁薑汁各二碗共前藥浸一宿放鍋內文武火熬煎藥色不易黑必待滴油黑色去渣每藥油一斤下飛過好丹六兩候成膏再加白水煮過鬆香一斤黃占一斤攪勻氣溫方入乳香沒藥木香輕粉胡椒硫黃各四兩白芥一斤五味研為極細末入膏內攪勻每膏一斤入蟾酥五錢厚絹攤貼肉癢出汗禹糧丸治五勞七傷氣脹飽滿黃病四肢無力女子赤白帶乾血勞症久瘧痞塊俱宜服之餘糧石二斤半好醋八斤同煮醋乾為度溫毒結毒臁瘡方宮粉煅七分紅楬子煅灰二錢文蛤胎髮白螺絲殼各燒灰存性各二分輕粉一錢乳香六錢沒藥二分兒茶一分瓜兒血竭一個蟾骨五真珠三分上十二味俱為細末磁瓶收貯用時先將甘草湯洗去患處膿水後將藥摻上瘋病另一名目形狀鑑別法大麻瘋十來日起如白膚冬瓜一般節節崩裂生血直流癩麻瘋遍身癩瘡又膿水雞腳瘋面上浮行眉毛十來日脫下冷麻瘋遍身冰冷麻木不知痛癢宜服醉仙散蛇皮瘋身上花斑如蛇皮一樣爛麻瘋身上連片而爛漏蹄瘋手足皆穿燥麻瘋身上白肉如麩皮一般胡桃瘋身上自起紅塊雁來風手撫腳噪血瘋身上手腳紅脹荷葉瘋如荷葉連片無發白虎瘋走注骨節痛宜服虎骨散紫癜瘋身上紅色如雲頭片一般用四神散服烏蛇浸酒方白癜瘋身上有白點遍身虛白用四神散服烏蛇浸酒方姜孤瘋手除腳爛用萆麻法胭脂瘋半邊面紅用浸酒藥鵝掌瘋手上皮粗厚微黃色用擦藥薰洗藥鶴膝瘋膝上青紅腫痛服小續命湯加萆薢川楝子獨活木瓜草鞋瘋腳上疼如針刺用萆麻法裙帶瘋腿肚連片生瘡痛瘋遍身麻痛服醉仙散四柱瘋手腳麻木服醉仙散四患瘋四肢生瘡用浸酒藥桕油丸擦蠱瘋身上如刀割服白花蛇煎刺瘋遍身如針刺服乳香犀角丸惡瘋頭面四肢全體癮疼疹瘰服硫黃散癧瘍瘋面項生白駁狀如白癬服炊帚散蠔毛瘋身上疼痛衣服也穿不得不治李子瘋身上起紫潰爛深潭不治打烏瘋口吐白沫橫倒在地手足齊起不治赤遊瘋肚腹脹大者不治剪指瘋手指並做一塊不治烏麻瘋黑漆柱一般由骨里黑出來不治振鬥瘋手振不治老鼠瘋日間不痛至夜疼者不治回生録治瘋法夫風者百病之長故諸家方論集之於首也至大麻風雖有三十六種之症然亦原於六邪皆不外風寒暑濕燥火或酷熱大水或醉後坐臥迎風傳入毛竅或雨雪濕衣霑體或久冰皮膚凍頑不知或遇火烘薰其氣收於經絡傳於榮衛或酒後坐臥濕地或酒後大熱睡臥深林恣為涼快或因濕草地上睡臥或患者登廁乘患者之毒或睡臥患者床褥或與患人交合傳染是皆五臟之受其毒而有青黃赤白黑者形於面目見於肌膚假如心經受病名曰火癩其色赤腳上起紫眼昏有絲或如火燒之狀或斷肢節眉發脫落肝經受病名曰木癩其色青遍身紫緑或有泡起眉毛不落面目掩著如生瘡之狀脾經受病名曰土癩其色黃有浮氣遍身起黃癬身有瘡如㾦㿔形如彈子或似青毒漸漸潰爛肌膚搔癢眉發皆脫肺經受病名曰金癩其色白眉毛脫落面如蟲行之狀遍身如癬如鱗腎經受病名曰水癩其色黑有瘢腳底潰漏四肢少力此乃毒氣受於內而形色現於外又有五死之由皮死之由麻木不仁骨死之由鼻梁崩塌筋死之由指節斷落血死之由潰爛成膿肉死之由割不知痛又有二絶不治肺絶失音腎絶耳聾此二者不治之症也百骨節痛毫竅出血名曰𢟳心息之癬與腎經同治初染之時不以為害風入皮膚不知不覺故流於四肢傳於五臟則腠理壅塞不通因血氣乖離遂至成症況有愚人不知生死之門恣意貪淫不節飲食不避風寒任意作樂不信良言以致不救深可嘆也治法列於下心經受病其色紅遍身起紅色者是也用火煎藥方防風羌活各四兩天麻三錢胡麻二兩炒苦參八兩米泔浸菖蒲二兩花粉木瓜川歸僵蟲蔓荊子去皮獨活升麻黃芩菊花薄荷蒺藜檳榔各二兩川芎地骨皮前胡黃柏荊芥各四兩剪草全蠍各一兩硃砂五錢枸杞子一兩五加皮四兩大楓子一斤去殼上為粗末每服一兩水煎溫服渣再煎欲出汗之前先服此藥一帖出汗用火草藥四日汗一次待紅色消盡方止火草藥方桑葉荷葉皂角葉菖蒲何首烏萆麻葉蒼耳草豨蘞葉忍冬藤葎草葉似天麻而小葉上有刺而無尖者各四兩上用河水三桶煎滾熱用大浴缸一隻將滾藥湯傾入缸內用木架令患者穩坐其上外用雞籠罩定用舊綿被四圍密遮放頭出外頭上用衣蓋之待一時久不耐坐去罩即令上床切勿見風即服丸藥戒口為重直候身無汗方起次早切勿梳頭恐