body:
  text: 三十六種大麻瘋症神效方夫大瘋者天地殺厲之氣邪毒變化穢濁傷人為症不同矣所見多端甚為慘懼雖三十六種其要不離乎燥屬肺濕屬脾也或因醉後當風或因汗身落水或浴後近風或房後冒風坐濕或手足被風傷引入毒或暴風取涼寒暑燥濕浸澀皮膚流注經絡即時不知疼痛變成此患積於臟腑發於四肢頭面輕則或痛或瘡或疤重則癩癬皮頑肉死手足麻木刀切不疼潰爛成膿筋死眉指脫落鼻梁崩塌眼瞎唇反以致聲啞決難治療須要審問米洞虛云五色不治余皆治之蟲食肝則眉落食肺則鼻崩食脾則聲啞食心則足底膝虛腫食腎則耳鳴啾及耳內爛或燥或痛或癢如蟲行自頭面起者為順易治自足起者為逆難治庸醫不識祕妙縱意刀針火點艾炷傷人多矣治此者必須明醫妙手患者盡心絶欲忌毒物戒怒氣洗心滌慮淨室獨居存心調養慮虧全功然後可以服藥調治今具三十六種瘋症種種辨形立方次第蛇酒煎飲丸散擦藥敷藥膏藥洗浴再審病症起末根由從何而起仔細看其輕重發於何處是何病源量病加減永無不驗重則半年輕則三月漸漸除根服藥之後眼目清亮皮膚光潤眉落更生血氣調和服藥先服搜風順氣散數帖次服防風通聖散數帖可服宣吊之藥次服丸藥藥酒須要依方仔細醫治不可亂投藥餌如有不效恐系察症之誤莫將此書輕視戒之慎之第一起自手足頭面不過三月出水乃是大瘋之症重者指頭出水眉毛脫落其病難治先服烏藥順氣散麻黃殭蠶烏藥各三兩陳皮枳殼桔梗乾薑各一兩川芎一兩歸尾一兩半防風三兩五加皮一兩痰重加半夏腳氣加木瓜共作十帖若寒熱四肢倦加蔥白三根水姜煎發汗體不能伸屈加好酒半鍾遍身瘙癢成瘡加薄荷常服疏風順氣散如渾身黑而不發出者須先用追風散表其穢毒葶藶三分胡麻炒苦參蒺藜炒防風花粉全蠍各二兩醋炙黃殭蠶炒蟬退各三兩甘草水洗共為末入輕粉一兩和勻分作十八服苦茶送一服虛人誤服殺人甚捷三日唇口腫起牙縫吐黑水二碗必遍身疼痛如痛臭用漱口散服盡必痢下五色便溺乃臟腑根源毒氣惡水皆出其物用瓦器盛之埋於無人處病人吃粥時用漱口散藥吐盡毒物方可吃粥間人看望須待嗽口完後方可入所吐毒物用蓋桶盛之埋入土內須防毒氣傳染再用貫衆防風羌活香附藿香荊芥銀花寄奴甘草各等分水煎漱口去毒涎惡氣吐盡方可吃粥飯以後服神蛇酒如輕但服後方敗毒散大黃朴硝黃柏角刺浮萍各三錢七月半取黑醜虛人不可誤用鬱金各五錢為末酒糊丸每服五錢空心酒送下辰時服三錢加川山甲五錢午後服一錢五分冷酒送下任其吐盡用蜜水漱口方服神蛇酒專治三十六種麻瘋肌膚麻木遍身瘙癢癩瘡癮疹面上遊風如蟲行紫白點風眉落鼻崩腳底穿爛肉死癢痛一切癭瘤癧串無名腫毒梅花爛瘡並痛風可治白花蛇一條去頭尾黑蛇一條去頭殭蠶一兩炒川烏白芷生熟地玄參白朮各一兩苦參五兩荊芥防風石菖蒲細辛天麻各一兩浮萍當歸秦艽海桐皮麻黃狗脊牛膝葶藶草烏蒼耳子木瓜靈仙胡麻白芍人參馬鞭草枳殼肉桂蛇床枳實皂角白蘚皮五味子肉蓯蓉木鱉子五加皮各三兩土茯苓青葙子金銀花各一兩薄荷三兩全蠍一兩蜈蚣三十條去頭桑寄生白茯苓蟬退去頭足甘草各二兩連翹三兩上為飲片先用元米七升釀成白酒漿勻作四壇盛之聽用又用水二斗放入酒糟一升另用大壇盛之將前二蛇及藥俱入壇封口早煮至晚取出待冷開入四壇酒漿內另將蛇取出去皮骨焙乾聽用又加下藥血竭乳香各一兩沒藥五錢沉香檀香雄黃辰砂穿山甲各一兩麝香二錢牛黃二錢阿魏二錢與前二蛇共研細末攪勻四壇內封固又煮一時服一杯後瀉六七次方可吃飯已後將稀粥補之早晚各一次再服寶鑑換肌丸藥酒送下五十丸吃稀粥睡十日後方可寶鑑換肌丸川芎當歸天麻各一兩細辛荊芥干菊苦參紫參沙參甘草芍藥蒼朮草烏蒺藜木賊天冬何首烏蔓荊子淫羊藿大楓子胡麻子石菖蒲酒洗各一兩去土上共為細末酒糊為丸每服五十丸即用下方洗浴及擦藥蒼耳子一斤黃荊條三斤五倍子二兩大風殼半斤金銀花半斤青木香四兩晚蠶沙半斤上樹龍五錢荊芥半斤防風半斤加椿槐桃柳枝各一把礬三兩同煎濃大缸浸水洗浴四圍遮好勿透風氣為妙後上擦藥大楓子川槿皮蛇床子無名異寒水石黃連黑狗脊各二兩朴硝狼毒各三兩巴豆鵝管石川椒雄黃各一兩硫黃樟腦枯礬檳榔各二兩上為末加羊蹄根芭蕉根椿樹葉搗爛絞汁入大楓子油和汁加輕粉將麻布包藥擦之黑處任從出毒血又擦三日再一浴之後再加大楓油搽之待肉成瘡濃水浸淫自然愈矣並治一切疥瘡神效亦可用麻瘋膏塗擦方草烏五錢雄黃輕粉各一錢半兒茶錢半另研青木香木筆天麻蒺藜狼毒各五錢粉霜錢半瘡口不合加乳香沒藥各五錢豬油四兩黃占七錢大楓油一兩將前藥切細片入香油內浸煎黑色去渣入油三次再煎再濾入前藥七味細藥將磁罐收貯塗之再用生肌立效風膏銅緑一錢七分白芨川甲各二兩乳香沒藥五錢銀粉一兩亂髮一團好丹龍骨兒茶花蕊石各五錢赤石脂三錢先將香油四兩入白芨川甲發銅緑四味煎黑色去渣入豬油半斤白膠香黃占松香各二兩化開入細藥攪勻攤膏貼患處一日一稱即愈第二起自腳底上一處切割不痛然後上臉臉上紅色滿顴漸成紫色一年之後遍身麻木眼爛及鼻崩則難治之先服搜風散烏藥防風茯苓半夏香附枳殼陳皮當歸川芎紫蘇生地地龍桔梗甘草乳香沒藥砂仁各一錢加生薑黑棗煎服自然疏風順氣神效再服奪命神蛇散治瘋不愈者眉落鼻崩一料全愈白花蛇黑梢蛇各一條俱用酒浸一宿去頭尾皮骨聽用蘄艾地龍三錢去土川芎當歸天麻蔓荊子銀花細辛沙參甘菊甘草胡麻草烏木筆子菖蒲各三兩為末每服三錢溫酒送下須在靜室中無風處服之上用被蓋汗出為度切忌臨風服其藥靈效病自除根矣用後洗浴方桃槐榆柳椿桑一把防風荊芥蒼耳草各二錢煎湯一鍋無風處洗浴擦藥方大黃黃柏黃連黃芩血竭兒茶水銀赤石脂螵蛸雄黃五錢硫黃三兩輕粉三錢為末調大楓油一兩擦之第三為紫雲瘋起時形如紫雲不識誤作赤遊風治之故不愈耳如若紫雲從上而下前後一同須要早治到陰處難治矣用防風通聖散防風荊芥當歸羌活獨活殭蠶甘草滑石黃柏白朮桔梗薄荷山梔川芎各等分為末先吃一服後加大黃芒硝連前藥各四錢水煎緩服至利為度不用服盡後服返元丸川芎羌活獨活細辛白芷當歸黃耆牛膝蟬退狗脊首烏全蠍各五錢防風各二十兩苦參一斤大楓子二十兩牛黃二錢血竭五兩上除血竭牛黃楓子三味另研余藥為末入三味勻和老米粉糊為丸每服五十丸起漸加至百丸為度清茶送下忌酒色勞碌豬羊鮮魚油膩生冷動氣發風之物止吃白鴨鯗魚食淡更妙重者半年輕者三月如未全愈再服通聖散並丸藥一料收功如鼻塞加皂角四兩骨節痛加谷樹皮四兩眉落加角針灰三錢生薑汁擦通身瘡加羌活獨活各五錢眼目昏花發熱加薑黃一兩又用前五枝煎湯洗浴或用膏藥方桐油黃丹各四兩龍骨一兩乳香沒藥各五錢大楓油八兩蛇床五錢血竭輕粉人發川椒雄黃各五錢硫黃一兩先將粗藥入桐油煎黑去渣煎好成膏下細藥收貯聽用第四紫霞瘋初起時形如紫霞遍身如雲頭樣其點牽長色在頭不露將火照之見其細白點可服祛風散人參茯苓甘草殭蠶羌活防風厚朴藿香蟬退麻黃薄荷黃柏獨活咳嗽加半夏不咳嗽加陳皮各等分或用搜風散白芷藿香前胡黃耆甘草人參羌活防風黃連荊芥各等分或用川烏通聖散川烏防風石膏川芎全蠍蒼朮枳殼殭蠶麝香一釐桔梗蟬退當歸薄荷各等分上三方加姜水煎再加好酒二小鐘熱服再用洗浴方柴胡前胡銀花蒼耳子五爪龍五加皮防風荊芥水煎湯洗浴浴後用擦藥硫黃輕粉枯礬各三錢黃丹蛇床各一兩水銀七錢黃連五錢黃柏三錢人參五錢無名異少許為末薑汁調擦之癢加川椒一兩服前二蛇散如不愈者毒深故耳否則服治二次除根第五火煉瘋起時面上火紅色四肢一身皆無力重則氣少日久月深瞼上如窠先損其目後折鼻梁以後難治先服川芎通聖散川芎當歸白朮白芍防風荊芥麻黃連翹黃芩甘草桔梗石膏山梔薄荷滑石姜水煎服如不行加大黃朴硝咳嗽加半夏三帖後服散風復元散黃芩白朮白芷細辛防風當歸杏仁羌活獨活生地熟地秦艽紫蘇防己知母姜水煎服五帖後將前方洗擦三四次即愈洗擦藥方在第四紫霞瘋內第六紫稍瘋此症色如紫藤模樣牛皮相似服防風復元散防風麻黃人參白芷當歸枸杞秦艽桔梗黃芩甘草羌活獨活細辛半夏防己茯苓芍藥前胡蒼朮藿香官桂香附生地熟地姜水煎服五帖後再服散風復元散方在火煉瘋內第七紫萍瘋起時形如紫萍其點或沒或見數日起一次者發作無時繫心經所染熱邪與前方不相宜應服通天散麻黃天靈皮細辛葳靈仙荊芥黃柏蒺藜花粉海桐皮桑白皮殭蠶蟬退川芎木通連翹蔓荊子姜水煎臨服加好酒二小鐘服五帖後用前擦藥不過三次即愈第八珍珠瘋起初時形如小鱉棋子遍身疙瘩塊久而不治遍身作癢若用熱湯蕩入皮膚則難治矣用加味祛瘋散黃柏細辛黃連大黃山梔薄荷甘草麻黃連翹荊芥白朮滑石川芎羌活獨活天麻熟地桔梗黃芩石膏芍藥防風各等分姜水煎臨服加好酒二小杯十帖後服天仙換骨丹狗脊去毛焙十兩細辛十一兩當歸一兩蟬退二兩白芷三兩川芎一兩牛黃五錢水蛭一兩五錢另研大楓子半斤去殼蒸熟烏藥十兩防風十兩牙皂三兩白芨七錢全蠍一兩五錢炒先將牛黃水蛭楓子蒸熟臼內打爛入藥末陳米飯為丸如緑豆大每服七十丸早晚酒下日進三服再用膏藥方荊芥防風白芷羌活黃芩阿魏各三兩大黃生地水龍骨即船上的油灰殭蠶各三兩乳香沒藥血竭雄黃輕粉全蠍各五錢川山甲一兩蟬退一兩蜈蚣一兩宮粉五錢先將粗藥入香油一斤煎黑色去渣成膏後用細藥收之聽用第九柘子瘋其形遍身如柘子細突而起久不出血其痛難忍即服千金托裡散在後冷水瘋內或用加減天麻散細辛苦參川芎靈仙首烏薄荷蒺藜蔓荊子明天麻防風荊芥甘草麻黃楓子石菖蒲各等分姜水煎服加好酒二小杯後用白花蛇酒白花蛇烏梢蛇各一條去頭尾皮骨升麻紫蘇枳實當歸香附熟地黃耆天冬丹皮粟殼川芎茯苓厚朴枳殼三稜蒼朮牛膝芍藥玄胡杏仁紅花肉桂蓬朮防風草果杜仲木香陳皮青皮半夏桔梗荊芥藿香各一兩殭蠶麥冬人參各二兩白芷楓藤麻黃各三兩乳香沒藥各五錢枳實五兩核桃肉四錢益智仁五錢上藥入在酒內封口晨煮至晚取出埋土去火毒七日分作四小瓶半月開飲如瘡口爛外貼阿魏膏藥防己一兩五錢荊芥白芷赤芍當歸黃連黃柏楓子肉人參連翹蓬朮各一兩黑醜一兩寸香一錢香油二斤黃丹八兩桃槐柳榆桑枝各七條長一寸為膏聽用另以楓子肉二兩川山甲八錢乳香沒藥寸香各下傾入瓶中收貯一應瘡癤俱可用第十凍眉瘋面上作癢久則眉落滿身麻木與麻木瘋同治先服防風通聖散加減防風芍藥甘草桔梗滑石黃芩薄荷石膏當歸川芎大黃麻黃連翹荊芥白朮山梔先加芒硝三錢一服瀉後去芒硝加半夏再服用此藥後改用浸藥方烏梢蛇三兩當歸一兩連翹甘草生地熟地山梔黃柏胡麻大力子枳殼首烏菖蒲蔓荊子蒺藜靈仙杞子蒼耳子防己茯苓天冬海桐皮石楠葉白蘚皮金銀花甘菊各三兩人參血竭各一兩草烏半斤五加皮五錢木香楓子肉乳香沒藥各五錢將蛇浸酒去骨再將諸藥為片用酒漿二十斤入瓶煮二時取出去火毒半月可服須盡醉服之將渣為末酒糊為丸每服三錢早晚二服好酒送下第十一劍眉瘋面上不癢只有眉眼二處作痛與痛眉風不同依方治之搜風順氣散歸尾殭蠶烏藥陳皮桔梗川芎白芷枳殼甘草乾薑茯苓羌活金銀花姜水煎服五劑如不好再服前蛇酒方立愈第十二雁來瘋雁來遍身作癢皮膚燥烈雁去方好三年後不治成大瘋之症用撥雲散川芎當歸細辛苦參靈仙首烏薄荷天麻甘草防風荊芥蒺藜菖蒲殭蠶五加皮蔓荊子姜水煎加好酒二小杯服自然不癢其風自退不效再服後藥酒方牛膝狗脊川芎川斷杜仲防風石蟹石楠葉烏藥半夏甘菊茯苓防己草烏生地熟地五加皮好酒漿二十斤煮三炷香為度去火毒半月方飲盡醉為度第十三雁去瘋此症與前症同治皆因患寒暑不同矣第十四脫指瘋此症只因食不勻損傷筋骨十指尖得病指甲皆落若不早治後成大患用驅風湯川芎羌活獨活防風甘草連翹當歸山梔黃柏桔梗薄荷加蔥白五個姜水煎服汗出為度後服去蔥十劑為止再服羌活通聖散羌活獨活防風川芎細辛薄荷蟬退白芷黃耆首烏牛膝狗脊砂仁木香沉香血竭各二兩當歸三兩苦參五錢牛黃二錢乳香五錢寸香一錢蟾酥五錢山甲天靈蓋羯羊角全蠍虎骨各一兩地龍去土一兩芒硝五錢蜈蚣七條烏梢蛇肉五錢共為末每服二三錢好酒送下第十五截指瘋此症筋骨先爛後損十指先起指腫甲下出水不過一年逐節脫落難治先服前搜風散五帖後服香蛇酒即愈此方外科聖藥非但治瘋並可治楊梅瘡一切無名腫毒惡瘡服輕粉太多者遍身痛癢瘋症左癱右瘓一切可治又治風癬疥瘡等症乳香雄黃硃砂各五錢寸香五錢血竭一兩木香一兩蟾酥二錢共為末用元米二斗五升入藥拌勻蒸熟做酒聽用白花蛇烏梢蛇各一條蜈蚣十條蟬退五兩全蠍二十個用水二斗煮一斗五升和前藥酒將藥並蛇等為末酒糊為丸好酒送下或用芙蓉酒金銀花蜈蚣荊芥靈仙首烏石膏甘菊蒺藜芙蓉葉胡麻苦參天麻連翹杜仲黃柏川芎大力子當歸防風羌活獨活白朮人參甘草蒼耳子黃耆細辛各一兩用袋盛之入前藥酒內煮三炷香為度出火毒過半月隨意盡醉方好第十六鼓釘瘋形如鼓釘疼痛難忍瘡頭皆紅色初起不可出血出血難治先服前羌活通聖散次服達芷丸黑醜大黃鬱金朴硝浮萍皂角刺為末酒糊為丸每服三錢空心好酒送下取下毒氣為妙下黑色為度亦用神蛇酒先吃再用保命丸玄參一兩雄黃四錢香蛇六錢苦參六錢辰砂四錢蜈蚣六錢珍珠四錢龜板灰六錢冰片朴硝三錢牛黃六錢麝香三錢角刺四錢雲母石三錢天靈蓋五錢樺樹皮灰二錢為末赤豆粉為丸每服二錢冷酒送下第十七蛇皮瘋形如蛇皮此乃大瘋之症如遍身不癢易治癢急早治之必服大楓方醫治後有加減洗擦方或先用加味撥雲散桔梗陳皮烏藥枳殼川芎麻黃殭蠶獨活甘草乾薑防風荊芥金銀花五加皮水煎服二十帖全愈再用洗浴方靈仙沙參紫參厚朴荊芥蔓荊子各一兩白芷五倍蒼耳子各二兩防風五錢黃荊條半斤水一鍋煎湯洗之再用擦藥方中丹砂大楓油一兩硫黃黃柏黃連大黃朴硝兒茶雄黃赤石脂水銀輕粉人參蛇床各一錢上為末大楓油調擦倘不愈再服前酒藥方第十八牛皮瘋形如牛皮黑色不痛不癢皮膚厚而麻木用大瘋方治之先服前通聖散五帖後服搜風奪命丹雄鼠屎防風人參草烏各八兩靈脂二兩京墨南星二兩煨細辛乳香天麻各二兩甘草五錢寸香一錢巴霜二錢羌活二兩獨活二兩共為末酒糊丸量病輕重或一錢或二錢先用蔥白嚼爛好酒送下或用追瘋奪命散當歸羌活獨活防風天麻殭蠶全蠍滑石甘草黃柏連翹薄荷山梔黃連黃芩白朮茯苓桔梗苦參牛膝木瓜川芎各等分水煎第一帖加燈心十莖大黃芒硝各五分第三帖加麻黃令出汗去大黃芒硝後服浸酒醉仙散羌活獨活防風白芷細辛天麻苦參玄參當歸芍藥麻黃木瓜牛膝首烏各三兩草烏一兩乳香沒藥川烏全蠍各五錢酒浸七日煮三炷香隨量服之渣為末酒糊為丸仍用醉仙散酒服之第十九白粉瘋形如白粉肌膚如霜久則難治先用追風散大力子三錢胡麻杞子蔓荊子苦參天花粉蒺藜防風各三兩蟬退全蠍殭蠶各三兩蜈蚣三條酒洗共為末加乳香一錢一分作十八服每日空心服二錢好茶送下服三日後如唇腫牙縫出血遍身如刀刺覺口臭用漱口藥服六七日必痢下五色糞乃臟腑毒氣根源所出惡水臭物瓦器盛之埋無人處患人吐出漱水不可咽下少頃方可吃粥不至毒氣入腸吐時須用有蓋桶盛之埋過勿令好人染其毒也滌穢漱口散羌活防風甘草貫衆香附荊芥藿香川芎寄奴銀花水煎漱口吐出毒涎毒氣如溝瀉下無妨亦可用斷後湯訶子厚朴香附陳皮蒼朮甘草半夏豬苓澤瀉藿香蒼耳子水煎半碗服吐出涎六七日方好第二十鱔孔瘋身上瘡不分大小皆出膿血服止血活血藥不出血可治先服前搜風散五帖後服通聖丸乳香川甲銅緑水銀苦參辰砂沒藥連翹血竭各一錢蟾酥五分用海帶研如泥和前藥為丸如卜子大每服五丸用蔥白嚼吃熱酒送下以汗為度如爛瘡用阿魏膏貼之再用平安散丸大力子苦參玄參胡麻荊芥大楓子肉炒當歸各二錢全蠍蟬退各一錢龜板煅連翹蒺藜蔓荊子天麻首烏各一兩辰砂三錢乳香沒藥天靈蓋各一錢雄黃三錢烏蛇一兩輕粉二錢蜈蚣二錢寸香一錢上為末酒糊為丸如緑豆大每服五十丸清茶送下日進三服半月之後自然除痛止血一月後愈第二十一冷