此心經火盛用楓子頭一斤丹用二分鵝口瘋初起生瘡作痛熱引諸陽聚會於面久則致成大瘋乃皮染滋瘋入腸極熱之症用大楓子頭一斤丹用五分烏蛇丸方烏蛇一條去皮骨酒煮地骨皮去土骨山梔白芷草烏白附子胡椒各等分為細末入楓子油二兩五錢拌勻如無油入楓子肉五兩和為丸每服三四十丸溫酒送下空心食前臨臥日進三服敷藥方黑狗脊去皮二兩蛇床子四兩寒水石二兩硫黃六錢枯礬朴硝少許各等分研細末香油調敷未爛不必敷之生眉毛藥方皂角刺焙乾鹿角煅存性薄荷蜂房牛口茨銀花天羅藤地松各等分為末醋調敷上豨蘞丸原方豨蘞淨葉一斤九蒸九曬大胡麻二兩酒洗蒸防風二兩去蘆生地四兩酒浸曬白芷二兩羌活二兩白蒺藜二兩炒去刺獨活二兩荊芥二兩天麻二兩麵包煨苦參二兩煉蜜為丸每服四錢空心陳酒送下加減豨蘞丸方豨蘞一斤九蒸九曬入肝腎二經補元氣祛風濕強筋骨長眉發生髮鬢能宣能補久服延年何首烏八兩去渣皮酒浸黑豆拌蒸曬九次為度要生者一斤製得八兩苦參四兩元米泔浸一夜去浮面腥氣曬乾焙明目止淚去濕殺蟲專療大風腸癖川牛膝二兩補腎氣除寒濕引諸藥下行淮生地八兩竹刀切片曬焙乾勿犯鐵器涼血補陰去瘀生新薏苡仁四兩炒祛風濕理腳氣除熱健脾多用自效白蒺藜八兩杵去刺炒行血下氣明目治風補腎止遺牡丹皮二兩酒洗除風痹去瘀血大胡麻四兩水淘去浮酒蒸補陰去風久服延年防風三兩去蘆專治久風惡風尤解附子毒甘菊花四兩焙乾補陰氣明目聰耳除胸中熱去頭面寒死肌濕痹目淚頭疼枸杞子四兩焙明目補腎又去皮膚骨節間風散瘡腫熱毒久服延年川羌活三兩去蘆散八表風邪利周身節痛善行氣分以理遊風當歸二兩去瘀生新舒筋潤腸獨活二兩治新舊諸風濕痹筋骨攣疼善行血分以理伏風云白朮二兩九制腰臍血結祛周身濕痹且制胡麻之滑潤白芷二兩明目散風祛寒燥又治頭面但不可久用明天麻二兩大如茄麵包煨活血通竅治諸風麻痹不仁語言癱瘓荊芥二兩行血發汗療風在皮裡膜外者甘草二兩炙亦可生用解百毒和諸藥尤解附子毒秦艽二兩祛風活絡養血舒筋上為末用金銀花五斤煎膏為丸每服五錢陳酒或白湯送下空心午後二次第二次服當加人參三兩去白朮一味浸酒方何首烏四兩生用去皮川牛膝一兩宣木瓜一兩去濕調榮衛腰腎腳膝之要藥也防風二兩淮生地二兩丹皮一兩蒼耳子四兩杵碎去刺炒當歸二兩苦參二兩米仁二兩桂圓肉二兩川羌活一兩秦艽二兩蘄蛇一兩去皮骨用陳酒不拘斤兩滿壇隔湯煮香三炷為度簡便洗浴方苦參一斤荊芥一斤防風四兩甘菊花四兩隨意加桑葉松毛豨蘞葉金銀花俱可擦藥當歸五錢紅花五錢芍藥五錢黃耆五錢甘草苦參血餘白附子防風白芷杏仁各五錢膽礬三錢不癢可不用上用麻油二斤同煎煮藥渣枯黑色去渣入白蠟二兩收為膏不拘時敷患處紫雲白癜破皮三等瘋方防風荊芥角針殭蠶烏藥陳皮麻黃靈仙生地銀花水煎空心服又三等瘋酒方風藤蒺藜荊芥川芎白芷胡麻羌活獨活首烏豨蘞烏蛇各一兩苦參防風當歸各三兩川烏草烏桔梗各一兩將大酒七斤入瓶內煮三炷香出火毒空心服一杯日進三服麻瘋出汗方甘草一斤麻黃三斤烏藥十二兩乳香沒藥各三兩防風荊芥苦參蒺藜各一兩殭蠶一兩鬧楊花四兩大胡麻一兩核桃四兩紅棗一斤火酒一斤水五斤蟬退全蠍各二兩烏蛇一條共入罐煮三炷香出火毒吃仙傳急救麻瘋法但有人犯此症者全體頑麻肉死割切不痛可治皮死麻木不仁不治骨死鼻塞可治筋死手足脫落可治血死遍身燥爛外腎並腫可治凡三喪不治心喪兩目失明肝肺喪失聲腎喪兩耳聾塞除此三喪急治之皆效先服靈明散檳榔大黃貫衆黑醜半生熟各一兩雷丸五錢半角刺灰一錢五分大戟一錢五分共為末用皂角煎膏為丸每服三錢空心冷茶送下天明瀉下或蟲或積但見青黃赤白蟲可治黑蟲難治用淨盆小便看之如碎麩皮相似過三日後再服妙應黑白散凡人身中有一萬八千尸蟲共成在人身體中若無尸蟲人身不立復有諸虛諸積黃病諸瘋若犯之非害人身也或眉發脫落遍身生瘡痛焠作癢日久如魚鱗者服此藥立效烏梢蛇白花蛇各四兩用中段酒浸一宿去皮骨大川烏一兩五錢切碎何首烏草烏三兩川烏用麻油浸一宿取出去油炒乾用薄荷荊芥各五兩木香芍藥當歸防風白芷天麻川芎羌活獨活甘草各一兩乳香沒藥各五分自然銅醋煅七次為末三分如虛弱中年將大黃荊芥羌活各退用十味為末每服一錢夏天冷酒送下冬天熱酒送下日進三服午時茶送下一半為末一半糊丸如桐子大每服一錢二分清茶送下末藥酒送下雙日服末單日服丸除瘋丸楓子一斤酒浸秋冬五日夏三日研碎入藥人參五錢防己沒藥各一兩官桂五錢白芍一兩荊芥一兩防風一兩五錢當歸一兩獨活二兩羌活玄胡索大黃各一兩蟬退七錢蒼朮一兩半夏一兩五錢薑黃麻黃乾薑各一兩五錢甘草一兩五錢柴胡枳殼石楠葉各一兩黑醜一兩五錢杏仁去皮尖烏藥地骨皮乳香陳皮各一兩黃芩胡麻炒各二兩香蛇一兩黃柏苦參各二兩川甲七錢五分黃連六錢五分甘菊二錢二分靈仙五錢蔓荊子一兩炒共為末老米粉為丸每服五十丸空心酒送下日進三服大瘋退熱散大寒之劑必倒脾胃若非火熱不可輕試麻黃二兩石膏二兩滑石三錢白芍一兩五錢薄荷二兩黃芩山梔各二兩白朮二兩獨活羌活連翹各二兩大黃三兩歸尾朴硝各二兩為末每服三分下洗浴方治瘡癬如魚鱗之形或癢痛皆可治之首烏苦參荊芥防風朴硝地骨皮各一兩艾葉桃槐柳各四兩先將上四味打碎用水一鍋與前亦六味同煎數滾去渣淋洗浴後服前藥一服百日可愈如年久深遠風毒惡瘡俱可洗之治疼痛走注瘋症方精德烏草烏各二兩首烏二兩南星自然銅醋煅五次靈脂松香地龍去皮各一兩木鱉子一兩切碎水浸一宿去殼末如麻瘋不知疼痛加川山甲五分蛤粉同炒入藥拌曬乾酒浸後為末水丸如彈子大曬乾細嚼好酒每服送下一丸如麻木處用刀破出血若遍身生痛作癢川芎煎酒送下此藥不可多服忌房事毒物鹽醬生冷金棗丹治諸般麻瘋並痛瘋頑麻癱瘓川烏去皮防風雄鼠屎各五兩炒獨活蒼朮泔水浸三日蔓荊子荊芥各四分木香三兩羌活細辛各二兩全蠍一兩去尾雄黃一兩五錢當歸一兩萆麻子三兩甘草二兩乳香一兩番木鱉二兩酥油蜜炙首烏四兩殭蠶六兩炒藁本四兩沒藥一兩草烏二兩共為末元米粉糊為丸金箔為衣好酒送下量大而壯者一錢弱者五分末尤妙此藥數服不可見風忌豬羊鮮魚發風等物治瘋丸蒼朮半斤四制皂角一斤酒拌九蒸九次當歸二斤酒洗苦參一斤豨蘞一斤曬乾蜜酒拌蒸九次曬乾為末酒蜜為丸每服二錢老酒送下日進三服重者一月輕者二十日可愈升煉擦藥方大楓肉方八肉二味研蛇床子萆麻仁檳榔黑醜殭蠶紅花子大麻子白芥子棉花子芝麻雄黃各二兩硫黃一兩黑豆一升各為末用油胡桃肉半兩將前藥拌勻共入罐內槐枝條塞滿罐口四面用鹽泥封固如法開坑先將大碗一隻放在坑內次將藥罐倒令將罐口對碗口四面鹽泥固好外用磚砌八眼爐圍藥罐在中四圍桑柴火燒罐底三炷香冷定取出將油退火毒擦瘡患妙極如神統治三十六種瘋疾神方蒼朮泔水浸酒炒麻黃去蘆各三兩白朮麩炒三兩七錢草烏一兩半甘草麻黃制防風細辛甘草首烏各二兩白附子雄黃各五錢川芎三兩七錢五分靈仙羌活全蠍白芷蜂房有子用天麻遠志各三兩共為末每服一錢二分要發汗服一錢七分臨睡熱酒送下以醉為妙萬靈龍蛇換骨丹專治三十六症大麻瘋症神效仙方防風一兩五錢乳香五錢沉香三錢木香五錢甘松一兩五錢大黃二兩五錢苦參一兩五錢沒藥三錢白芷紫背浮萍七月中取天麻蒼耳子各一兩五錢將前藥十二味為末聽用麻黃二兩將滾湯泡過用泔水念碗浸三日三夜取出打爛浸藥水煮三五滾去渣煎成膏子將前藥末打為丸分作一十八丸將陳酒一碗用藥打碎入罐內重湯煮一炷香取出服之取汗避風方好後用前項擦藥除根丸藥方羌活獨活各六兩兩頭尖三兩寸香五錢草烏二兩胡麻半斤荊芥蒼朮各七兩靈仙六兩酒洗石菖蒲六兩酒洗木通三兩當歸八兩虎骨二兩半炙苦參一斤藁本六兩殭蠶二兩蟬退半斤酒洗白芷六兩杜仲五兩鹽水炒連翹六兩蒺藜半斤去刺硃砂七錢七分黃芩生地六兩楓子肉二兩炒升麻四兩風藤五兩首烏六兩天麻五兩牛膝半斤全蠍六兩細辛四兩川芎三兩山梔半斤蔓荊子六兩蒼耳子半斤取肉共三十六味管三十六種瘋疾共為末老米粉為丸每服二錢好酒送下白湯亦可日進三服治大麻瘋仙方用大肥鴨一隻餓一日將赤練蛇一條切碎麻黃四兩羌活四兩大附子三兩寸香一錢共為末用好酒一碗陳米二升拌勻作三四日餵鴨待後鴨毛將落盡殺之煮爛去骨加川烏草烏紅花蟬退各一兩豨蘞草當歸白花蛇金銀花各四兩土茯苓五斤發灰二兩伏龍肝五錢共為末和鴨與酒糊為丸桐子大每服六十丸加至百丸止好酒日進二服治大麻瘋洗浴取蟲法取大公雞一隻帶血撏光去毛肚淨下鍋多水煮熟先以毛湯濾清俱入浴缸內洗浸長久得透又用前湯再洗透拭乾以新青布被單蓋之上用綿被或夾被蓋須臥得安穩量病人酒量多少飲醉睡去遍身出汗看其被上細白蟲無數出盡全愈再服養氣活血去風順氣之藥忌房事發風動氣等物百日可愈雙目昏黑眉發自落鼻梁崩倒肌膚瘡爛不可救效方用皂角針三斤九蒸九曬為末煎膏為丸每服二錢白湯送下十日眉發自生肌膚潮潤眼目復明大麻瘋發汗洗浴方松毛十斤防風荊芥川椒各一兩皮硝四兩蔥汁薑汁各一盞野菊花鬧楊花各一大把將元米柴燒灰淋水二三桶煎前藥令患人入浴缸內重洗待汗出透為度未浴前先服防風通聖散加麻黃五錢蔥五根姜七片煎服後方可洗浴出汗雄漆丸治瘋如神好漆一斤醬蟹半斤打爛取汁煮漆待乾煙盡為度乾漆四兩配明雄黃半斤共為末豨蘞草煎膏為丸每服一錢好酒送下極重半斤輕者四兩為限豨蘞膏入肝腎二經補元氣祛風濕明耳目久服延年九月九日採得去根連莖葉細銼打爛取汁煎煉成膏以甘草熟地煎膏煉蜜三味收之酒調服功妙不可盡述曹邑宰傳酒藥方石衣半斤洗淨當歸四兩微炒羌活秦艽獨活各四兩烏芝麻半兩微炒用煮酒十斤浸數日早晚服之治口眼歪斜立效方川烏末用蟺血調勻敷患處左歪貼右右歪貼左治半爿頭痛瘋方用苦葫蘿煅灰每服一錢好酒送下先要大缸內洗浴後服藥出汗即愈治大麻瘋神效驗方大胡麻一斤炒小胡麻一斤炒苦參一斤米泔洗曬二次大楓子一斤去殼取肉砂鍋煮熟用燈草押去油研碎入藥當歸四兩白朮四兩土炒白芷四兩白蒺藜四兩去刺牛膝四兩酒洗荊芥四兩蘇州白菊花四兩去根蒂共曬乾磨成極細末水發為丸或米糊為丸如緑豆大每服四錢粗茶送下無論時候日服三次忌豬肉肝腸雞子鮮魚鴨子赤豆麵食南瓜茄子牛羊鵝犬肉白酒火酒並房事一切發物如此四年可全愈矣治癱瘓烏龍方川烏五錢炮去皮尖五靈脂五兩淘去砂二味共為末加冰片少許寸香一分共為細末滴井水為丸如皂角子大每日五更臨臥各服一丸以薑汁化開好酒調服一日二服疾輕者數日見效一年以上者一月可愈治鵝掌風方檳榔末一錢硫黃五分川椒末五分共為末用醃豬油調搽以側柏燒煙薰之又方檳榔冰片用糠油調搽取糠油法用糙米糠勿曬乾將大碗三隻碗麵上用綿紙糊蓋待其干將糠升許堆尖用火自上燒下隔紙寸許便去糠碗中便有油矣其子上有水窠將針細細挑穿用以擦上三五次可愈愈瘋丸治白點瘋生漆半斤用蟹五隻竹刀切碎拌漆內濾去渣煮三炷香豨蘞半斤九蒸九曬蒼耳草淨仁四兩雄黃五錢苦參六兩防風四兩共為末將前漆水為丸如桐子大每服十五丸加至五十丸七十丸止忌生冷豬羊鵝肉等物為妙
